<div class="min-h-screen bg-[#f8f9fa] pt-24 pb-16 px-4 sm:px-8 max-w-[1440px] mx-auto">
    <!-- Header Section -->
    <div class="mb-12 max-w-3xl">
        <h1 class="text-4xl md:text-5xl font-black text-stone-900 tracking-tight leading-tight mb-4">
            Khám phá những <br>
            <span class="text-[#173124] italic font-serif">điểm đến tuyệt vời</span>
        </h1>
        <p class="text-lg text-stone-500 leading-relaxed">
            Từ những ngọn núi sương mù phía Bắc đến những bãi biển ngập nắng phương Nam. Hãy để Clyvasync dẫn lối cho hành trình tiếp theo của bạn.
        </p>
    </div>

    <!-- Destinations Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let dest of destinations" 
            class="group cursor-pointer bg-white rounded-[2rem] overflow-hidden border border-stone-100 hover:shadow-xl hover:shadow-[#173124]/5 hover:border-[#173124]/20 transition-all duration-500 hover:-translate-y-2">
            
            <!-- Image Header -->
            <div class="relative h-64 overflow-hidden">
                <img [src]="dest.image" [alt]="dest.name" 
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                <div class="absolute inset-0 bg-gradient-to-t from-stone-900/80 via-stone-900/20 to-transparent"></div>
                
                <!-- Badges -->
                <div class="absolute top-4 left-4">
                    <span class="px-3 py-1.5 bg-white/90 backdrop-blur-sm text-stone-900 text-xs font-bold rounded-xl shadow-sm uppercase tracking-wider">
                        {{ dest.region }}
                    </span>
                </div>

                <div class="absolute bottom-4 left-6">
                    <h2 class="text-2xl font-black text-white mb-1">{{ dest.name }}</h2>
                </div>
            </div>

            <!-- Content -->
            <div class="p-6">
                <p class="text-stone-500 text-sm leading-relaxed mb-6 line-clamp-3">
                    {{ dest.description }}
                </p>

                <div class="flex items-center justify-between pt-4 border-t border-stone-100">
                    <div class="flex space-x-6">
                        <div class="text-center">
                            <span class="block text-lg font-black text-stone-900">{{ dest.homestaysCount }}</span>
                            <span class="block text-[10px] uppercase font-bold text-stone-400 tracking-wider">Homestay</span>
                        </div>
                        <div class="text-center">
                            <span class="block text-lg font-black text-stone-900">{{ dest.toursCount }}</span>
                            <span class="block text-[10px] uppercase font-bold text-stone-400 tracking-wider">Tour</span>
                        </div>
                    </div>
                    
                    <button class="w-12 h-12 rounded-full bg-stone-50 group-hover:bg-[#173124] text-stone-400 group-hover:text-white flex items-center justify-center transition-colors">
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
