<section class="animate-in slide-in-from-bottom-6 duration-1000 delay-300 ease-out">

    <div class="flex items-end justify-between mb-10">
        <div class="space-y-1">
            <div class="flex items-center gap-2">
                <span class="w-8 h-[1px] bg-primary/30"></span>
                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-primary/60">Step 03</span>
            </div>
            <h2 class="text-4xl font-headline font-black tracking-tighter text-primary">Phương thức thanh toán</h2>
        </div>
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-100 shadow-sm">
            <span class="material-symbols-outlined text-[16px]">verified_user</span>
            <span class="text-[10px] font-black uppercase tracking-widest leading-none">Bảo mật PCI DSS</span>
        </div>
    </div>

    <div class="bg-white border border-outline-variant/20 rounded-[2.5rem] overflow-hidden shadow-[0_12px_40px_rgba(0,0,0,0.03)]">

        <div class="bg-surface-container-low/40 px-8 py-4 border-b border-outline-variant/10 flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-[18px] animate-pulse">encrypted</span>
            <p class="text-xs font-medium text-on-surface-variant/80">Thông tin thanh toán của bạn được mã hóa 256-bit theo tiêu chuẩn bảo mật quốc tế.</p>
        </div>

        <div class="p-6 md:p-10 space-y-4">

            <label (click)="onMethodSelect('VNPAY')"
                class="group relative flex items-center justify-between p-6 rounded-3xl cursor-pointer transition-all duration-300 border-2"
                [class]="selectedMethod === 'VNPAY' ? 'border-primary bg-primary/[0.04] shadow-sm' : 'border-outline-variant/10 bg-white hover:border-primary/30 hover:shadow-md'">
                
                <input class="hidden" name="payment" type="radio" value="VNPAY" [checked]="selectedMethod === 'VNPAY'" />

                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 transition-all duration-300 group-hover:scale-105"
                         [class]="selectedMethod === 'VNPAY' ? 'bg-primary text-white' : 'bg-surface-container-high text-primary'">
                        <span class="material-symbols-outlined text-3xl">qr_code_scanner</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <p class="font-bold text-on-surface text-base">Cổng VietQR / VNPAY</p>
                            <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[9px] font-black uppercase tracking-wider rounded-md">Khuyên dùng</span>
                        </div>
                        <p class="text-sm text-on-surface-variant/70 leading-snug">Sử dụng ứng dụng Ngân hàng quét mã QR để thanh toán tức thì.</p>

                        <div class="flex items-center gap-2 mt-3 transition-all duration-300"
                             [class]="selectedMethod === 'VNPAY' ? 'grayscale-0 opacity-100' : 'grayscale opacity-40'">
                            <div class="w-8 h-5 bg-white rounded flex items-center justify-center text-[8px] font-black text-primary/70 border border-outline-variant/20">VCB</div>
                            <div class="w-8 h-5 bg-white rounded flex items-center justify-center text-[8px] font-black text-red-600 border border-outline-variant/20">TCB</div>
                            <div class="w-8 h-5 bg-white rounded flex items-center justify-center text-[8px] font-black text-blue-700 border border-outline-variant/20">BIDV</div>
                            <span class="text-[9px] font-bold text-on-surface-variant/40 ml-1">+40 Ngân hàng</span>
                        </div>
                    </div>
                </div>

                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200 shadow-inner shrink-0"
                     [class]="selectedMethod === 'VNPAY' ? 'border-primary bg-primary' : 'border-outline-variant/60 bg-white'">
                    <div class="w-2.5 h-2.5 rounded-full transition-transform duration-200 ease-out bg-white"
                         [class]="selectedMethod === 'VNPAY' ? 'scale-100' : 'scale-0'"></div>
                </div>
            </label>

            <label (click)="onMethodSelect('MOMO')"
                class="group relative flex items-center justify-between p-6 rounded-3xl cursor-pointer transition-all duration-300 border-2"
                [class]="selectedMethod === 'MOMO' ? 'border-[#AF146B] bg-[#AF146B]/[0.04] shadow-sm' : 'border-outline-variant/10 bg-white hover:border-[#AF146B]/30 hover:shadow-md'">
                
                <input class="hidden" name="payment" type="radio" value="MOMO" [checked]="selectedMethod === 'MOMO'" />

                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 border transition-all duration-300 group-hover:scale-105"
                         [class]="selectedMethod === 'MOMO' ? 'bg-[#AF146B] text-white border-[#AF146B]' : 'bg-pink-50 text-[#AF146B] border-pink-100/50'">
                        <span class="font-black text-xs tracking-tighter">MoMo</span>
                    </div>
                    <div>
                        <p class="font-bold text-on-surface text-base mb-1">Ví điện tử MoMo</p>
                        <p class="text-sm text-on-surface-variant/70 leading-snug">Thanh toán nhanh qua ứng dụng MoMo trên điện thoại cá nhân.</p>
                    </div>
                </div>

                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200 shadow-inner shrink-0"
                     [class]="selectedMethod === 'MOMO' ? 'border-[#AF146B] bg-[#AF146B]' : 'border-outline-variant/60 bg-white'">
                    <div class="w-2.5 h-2.5 rounded-full transition-transform duration-200 ease-out bg-white"
                         [class]="selectedMethod === 'MOMO' ? 'scale-100' : 'scale-0'"></div>
                </div>
            </label>

            <label (click)="onMethodSelect('TRANSFER')"
                class="group relative flex items-center justify-between p-6 rounded-3xl cursor-pointer transition-all duration-300 border-2"
                [class]="selectedMethod === 'TRANSFER' ? 'border-primary bg-primary/[0.04] shadow-sm' : 'border-outline-variant/10 bg-white hover:border-primary/30 hover:shadow-md'">
                
                <input class="hidden" name="payment" type="radio" value="TRANSFER" [checked]="selectedMethod === 'TRANSFER'" />

                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 transition-all duration-300 group-hover:scale-105"
                         [class]="selectedMethod === 'TRANSFER' ? 'bg-primary text-white' : 'bg-surface-container-high text-on-surface-variant'">
                        <span class="material-symbols-outlined text-3xl">account_balance</span>
                    </div>
                    <div>
                        <p class="font-bold text-on-surface text-base mb-1">Chuyển khoản thủ công</p>
                        <p class="text-sm text-on-surface-variant/70 leading-snug">Thực hiện giao dịch chuyển khoản vào tài khoản ngân hàng của công ty.</p>
                        <div class="flex items-center gap-1.5 mt-2 text-amber-600">
                            <span class="material-symbols-outlined text-[15px]">info</span>
                            <span class="text-[11px] font-bold tracking-tight">Lưu ý: Có thể mất 5-15 phút để đối soát giao dịch thủ công.</span>
                        </div>
                    </div>
                </div>

                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200 shadow-inner shrink-0"
                     [class]="selectedMethod === 'TRANSFER' ? 'border-primary bg-primary' : 'border-outline-variant/60 bg-white'">
                    <div class="w-2.5 h-2.5 rounded-full transition-transform duration-200 ease-out bg-white"
                         [class]="selectedMethod === 'TRANSFER' ? 'scale-100' : 'scale-0'"></div>
                </div>
            </label>

        </div>

        <div class="px-8 py-6 bg-surface-container-lowest border-t border-outline-variant/10 flex flex-wrap items-center justify-center gap-x-10 gap-y-4">
            <div class="flex items-center gap-2 opacity-40 select-none hover:opacity-70 transition-opacity">
                <span class="material-symbols-outlined text-primary text-lg">security</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-on-surface">Norton Secured</span>
            </div>
            <div class="flex items-center gap-2 opacity-40 select-none hover:opacity-70 transition-opacity">
                <span class="material-symbols-outlined text-primary text-lg">lock</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-on-surface">SSL Encrypted</span>
            </div>
            <div class="flex items-center gap-2 opacity-40 select-none hover:opacity-70 transition-opacity">
                <span class="material-symbols-outlined text-primary text-lg">payments</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-on-surface">PCI-DSS Compliant</span>
            </div>
        </div>
    </div>
</section>
