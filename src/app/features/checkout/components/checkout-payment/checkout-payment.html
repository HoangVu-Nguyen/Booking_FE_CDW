<!-- Bỏ vào component: checkout-payment.component.html -->
<section class="animate-in slide-in-from-bottom-6 duration-1000 delay-300 ease-out">
    
    <!-- Header: Editorial Style đồng bộ với các bước trước -->
    <div class="flex items-end justify-between mb-10">
        <div class="space-y-1">
            <div class="flex items-center gap-2">
                <span class="w-8 h-[1px] bg-primary/30"></span>
                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-primary/60">Step 03</span>
            </div>
            <h2 class="text-4xl font-headline font-black tracking-tighter text-primary">Phương thức thanh toán</h2>
        </div>
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-100 shadow-sm">
            <span class="material-symbols-outlined text-[16px]">verified_user</span>
            <span class="text-[10px] font-black uppercase tracking-widest leading-none">Bảo mật PCI DSS</span>
        </div>
    </div>

    <!-- Payment Container -->
    <div class="bg-white border border-outline-variant/20 rounded-[2.5rem] overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
        
        <!-- Khối cảnh báo bảo mật (Trust Bar) -->
        <div class="bg-surface-container-low/50 px-8 py-4 border-b border-outline-variant/10 flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-[20px]">encrypted</span>
            <p class="text-xs font-medium text-on-surface-variant">Thông tin thanh toán của bạn được mã hóa 256-bit theo tiêu chuẩn quốc tế.</p>
        </div>

        <div class="p-6 md:p-10 space-y-5">
            
            <!-- Option 1: QR Code (VNPAY / VietQR) -->
            <label class="group relative flex items-center justify-between p-6 bg-white border-2 border-outline-variant/10 rounded-2xl cursor-pointer transition-all duration-300 hover:border-primary/20 has-[:checked]:border-primary has-[:checked]:bg-primary/[0.02] has-[:checked]:shadow-md">
                <input checked class="hidden peer" name="payment" type="radio" value="QR" />
                
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-xl bg-surface-container-high flex items-center justify-center text-primary shrink-0 transition-colors group-has-[:checked]:bg-primary group-has-[:checked]:text-white">
                        <span class="material-symbols-outlined text-3xl">qr_code_scanner</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <p class="font-bold text-on-surface text-base">Cổng VietQR / VNPAY</p>
                            <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-[9px] font-black uppercase tracking-wider rounded">Khuyên dùng</span>
                        </div>
                        <p class="text-sm text-on-surface-variant/70 leading-snug">Sử dụng ứng dụng Ngân hàng quét mã QR để thanh toán tức thì.</p>
                        
                        <!-- Bank Logos simulation -->
                        <div class="flex gap-2 mt-3 grayscale opacity-50 group-has-[:checked]:grayscale-0 group-has-[:checked]:opacity-100 transition-all">
                            <div class="w-8 h-5 bg-surface-container-high rounded flex items-center justify-center text-[8px] font-black uppercase tracking-tighter">VCB</div>
                            <div class="w-8 h-5 bg-surface-container-high rounded flex items-center justify-center text-[8px] font-black uppercase tracking-tighter">TCB</div>
                            <div class="w-8 h-5 bg-surface-container-high rounded flex items-center justify-center text-[8px] font-black uppercase tracking-tighter">BIDV</div>
                            <span class="text-[9px] font-bold text-on-surface-variant/40">+40 Banks</span>
                        </div>
                    </div>
                </div>

                <div class="w-6 h-6 rounded-full border-2 border-outline-variant/50 peer-checked:border-primary flex items-center justify-center transition-all bg-white">
                    <div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform duration-300"></div>
                </div>
            </label>

            <!-- Option 2: Ví điện tử MoMo -->
            <label class="group relative flex items-center justify-between p-6 bg-white border-2 border-outline-variant/10 rounded-2xl cursor-pointer transition-all duration-300 hover:border-[#AF146B]/20 has-[:checked]:border-[#AF146B] has-[:checked]:bg-[#AF146B]/[0.02]">
                <input class="hidden peer" name="payment" type="radio" value="MOMO" />
                
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-xl bg-pink-50 flex items-center justify-center shrink-0 border border-pink-100 transition-colors group-has-[:checked]:bg-[#AF146B]">
                        <!-- MoMo Logo simulation -->
                        <div class="w-8 h-8 rounded-lg bg-[#AF146B] group-has-[:checked]:bg-white flex items-center justify-center text-white group-has-[:checked]:text-[#AF146B] font-black text-[10px]">MoMo</div>
                    </div>
                    <div>
                        <p class="font-bold text-on-surface text-base mb-1">Ví điện tử MoMo</p>
                        <p class="text-sm text-on-surface-variant/70 leading-snug">Thanh toán nhanh qua ứng dụng MoMo trên điện thoại.</p>
                    </div>
                </div>

                <div class="w-6 h-6 rounded-full border-2 border-outline-variant/50 peer-checked:border-[#AF146B] flex items-center justify-center transition-all bg-white">
                    <div class="w-2.5 h-2.5 rounded-full bg-[#AF146B] scale-0 peer-checked:scale-100 transition-transform duration-300"></div>
                </div>
            </label>

            <!-- Option 3: Chuyển khoản ngân hàng -->
            <label class="group relative flex items-center justify-between p-6 bg-white border-2 border-outline-variant/10 rounded-2xl cursor-pointer transition-all duration-300 hover:border-primary/20 has-[:checked]:border-primary has-[:checked]:bg-primary/[0.02]">
                <input class="hidden peer" name="payment" type="radio" value="TRANSFER" />
                
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 rounded-xl bg-surface-container-high flex items-center justify-center text-on-surface-variant shrink-0 group-has-[:checked]:bg-primary group-has-[:checked]:text-white transition-colors">
                        <span class="material-symbols-outlined text-3xl">account_balance</span>
                    </div>
                    <div>
                        <p class="font-bold text-on-surface text-base mb-1">Chuyển khoản thủ công</p>
                        <p class="text-sm text-on-surface-variant/70 leading-snug">Thực hiện giao dịch chuyển khoản vào tài khoản công ty.</p>
                        <div class="flex items-center gap-1.5 mt-2 text-amber-600">
                            <span class="material-symbols-outlined text-[16px]">info</span>
                            <span class="text-[11px] font-bold">Lưu ý: Có thể mất 5-15 phút để xác nhận thủ công.</span>
                        </div>
                    </div>
                </div>

                <div class="w-6 h-6 rounded-full border-2 border-outline-variant/50 peer-checked:border-primary flex items-center justify-center transition-all bg-white">
                    <div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform duration-300"></div>
                </div>
            </label>
        </div>

        <!-- Footer: Security Logos -->
        <div class="px-8 py-6 bg-surface-container-lowest border-t border-outline-variant/10 flex flex-wrap items-center justify-center gap-x-10 gap-y-4">
            <div class="flex items-center gap-2 opacity-30">
                <span class="material-symbols-outlined">security</span>
                <span class="text-[10px] font-black uppercase tracking-widest">Norton Secured</span>
            </div>
            <div class="flex items-center gap-2 opacity-30">
                <span class="material-symbols-outlined">lock</span>
                <span class="text-[10px] font-black uppercase tracking-widest">SSL Encrypted</span>
            </div>
            <div class="flex items-center gap-2 opacity-30">
                <span class="material-symbols-outlined">payments</span>
                <span class="text-[10px] font-black uppercase tracking-widest">PCI-DSS Compliant</span>
            </div>
        </div>
    </div>
</section>
