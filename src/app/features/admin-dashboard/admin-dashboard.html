<div class="min-h-screen bg-[#f4f4f0] font-sans selection:bg-[#173124]/20">
    <div class="flex flex-col lg:flex-row max-w-[1800px] mx-auto min-h-screen">

        <aside class="hidden lg:flex flex-col w-[260px] xl:w-[280px] flex-shrink-0 border-r border-stone-200 bg-[#fafaf9] sticky top-0 h-screen pt-8 pb-6">
            
            <div class="px-8 mb-10 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-stone-900 rounded-lg flex items-center justify-center shadow-sm">
                        <span class="text-white font-black text-sm tracking-tighter">Cly</span>
                    </div>
                    <span class="font-extrabold text-stone-900 text-lg tracking-tight">Clyvasync</span>
                </div>
                <span class="px-2 py-0.5 bg-stone-200/50 text-stone-600 text-[9px] font-black uppercase tracking-widest rounded-md border border-stone-200">Admin</span>
            </div>

            <nav class="flex-1 overflow-y-auto px-4 space-y-8 scrollbar-hide">
                
                <div>
                    <p class="px-4 text-[10px] font-extrabold text-stone-400 uppercase tracking-[0.2em] mb-2">Hệ thống</p>
                    <div class="space-y-1">
                        <a routerLink="/admin/dashboard"
                            routerLinkActive="bg-white shadow-sm border-stone-200/80 !text-stone-900 font-bold relative before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:w-1 before:h-1/2 before:bg-stone-900 before:rounded-r-full"
                            [routerLinkActiveOptions]="{exact: true}"
                            class="flex items-center gap-3.5 px-4 py-2.5 text-stone-500 border border-transparent hover:text-stone-900 hover:bg-stone-200/40 rounded-xl transition-all duration-200 group text-[13px] font-medium">
                            <span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">space_dashboard</span>
                            Tổng quan
                        </a>
                        
                        <a routerLink="/admin/hosts"
                            routerLinkActive="bg-white shadow-sm border-stone-200/80 !text-stone-900 font-bold relative before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:w-1 before:h-1/2 before:bg-stone-900 before:rounded-r-full"
                            class="flex items-center gap-3.5 px-4 py-2.5 text-stone-500 border border-transparent hover:text-stone-900 hover:bg-stone-200/40 rounded-xl transition-all duration-200 group text-[13px] font-medium">
                            <span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">manage_accounts</span>
                            Quản lý Chủ nhà
                        </a>
                    </div>
                </div>

                <div>
                    <p class="px-4 text-[10px] font-extrabold text-stone-400 uppercase tracking-[0.2em] mb-2">Tài chính</p>
                    <div class="space-y-1">
                        <a routerLink="/admin/transactions"
                            routerLinkActive="bg-white shadow-sm border-stone-200/80 !text-stone-900 font-bold relative before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:w-1 before:h-1/2 before:bg-stone-900 before:rounded-r-full"
                            class="flex items-center gap-3.5 px-4 py-2.5 text-stone-500 border border-transparent hover:text-stone-900 hover:bg-stone-200/40 rounded-xl transition-all duration-200 group text-[13px] font-medium">
                            <span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">receipt_long</span>
                            Giao dịch & Doanh thu
                        </a>

                        <a routerLink="/admin/wallet-approvals"
                            routerLinkActive="bg-white shadow-sm border-stone-200/80 !text-stone-900 font-bold relative before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:w-1 before:h-1/2 before:bg-stone-900 before:rounded-r-full"
                            class="flex items-center justify-between px-4 py-2.5 text-stone-500 border border-transparent hover:text-stone-900 hover:bg-stone-200/40 rounded-xl transition-all duration-200 group text-[13px] font-medium">
                            <div class="flex items-center gap-3.5">
                                <span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">account_balance</span>
                                Phê duyệt Rút tiền
                            </div>
                            <span class="px-2 py-0.5 rounded-md bg-red-100 border border-red-200 text-red-700 text-[10px] font-bold tabular-nums">3</span>
                        </a>
                    </div>
                </div>

            </nav>

            <div class="px-6 mt-auto flex flex-col gap-5 pt-6">
                
                <div class="px-3 py-2.5 bg-white border border-stone-200 rounded-xl flex items-center justify-between shadow-sm cursor-help" title="Database: 12ms | Gateway: 45ms">
                    <div class="flex items-center gap-2.5">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span class="text-xs font-semibold text-stone-600">Trạng thái Server</span>
                    </div>
                    <span class="text-[10px] font-bold text-emerald-600">100%</span>
                </div>

                <button class="w-full flex items-center justify-between p-2 hover:bg-stone-200/50 rounded-xl transition-colors text-left group">
                    <div class="flex items-center gap-3">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=1c1917&color=fff" alt="Admin" class="w-9 h-9 rounded-full border border-stone-200 shadow-sm">
                        <div class="min-w-0">
                            <h4 class="text-sm font-bold text-stone-900 truncate">Nguyễn Hoàng Vũ</h4>
                            <p class="text-[11px] text-stone-500 font-medium truncate">hoangvu.dev@admin</p>
                        </div>
                    </div>
                    <span class="material-symbols-outlined text-stone-400 group-hover:text-stone-600 text-[18px]">unfold_more</span>
                </button>

            </div>
        </aside>

        <main class="flex-1 min-w-0 bg-white border-l border-stone-200">
            <header class="h-16 border-b border-stone-100 flex items-center justify-between px-8 bg-white/80 backdrop-blur-md sticky top-0 z-20">
                <div class="flex items-center gap-2 text-sm font-medium text-stone-500">
                    <span class="material-symbols-outlined text-[18px]">home</span>
                    <span class="material-symbols-outlined text-[16px] text-stone-300">chevron_right</span>
                    <span class="text-stone-900 font-bold">Phê duyệt Rút tiền</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <button class="w-8 h-8 rounded-full hover:bg-stone-100 flex items-center justify-center text-stone-500 transition-colors relative">
                        <span class="material-symbols-outlined text-[20px]">notifications</span>
                        <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                    </button>
                </div>
            </header>

            <div class="min-h-[calc(100vh-64px)]">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
