<div class="bg-white border border-stone-200 rounded-2xl overflow-hidden shadow-sm">
      <table class="w-full text-left">
        <thead class="bg-stone-50 border-b border-stone-200">
          <tr>
            <th class="p-4 text-[10px] font-bold text-stone-400 uppercase">Chủ nhà</th>
            <th class="p-4 text-[10px] font-bold text-stone-400 uppercase">Loại tài liệu</th>
            <th class="p-4 text-[10px] font-bold text-stone-400 uppercase">Hành động</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let doc of pendingDocs" class="border-b border-stone-100 hover:bg-stone-50">
            <td class="p-4 text-sm font-bold">{{ doc.hostName }}</td>
            <td class="p-4 text-xs">{{ doc.docType }}</td>
            <td class="p-4">
              <button (click)="openDocumentViewer(doc)" class="text-[10px] bg-indigo-600 text-white px-3 py-1.5 rounded-md hover:bg-indigo-700">XEM TÀI LIỆU</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
