<!-- 2. CANVAS CONTENT -->
<div class="flex-1 p-6 md:p-12 lg:p-16 max-w-[1200px] w-full mx-auto">

    <!-- Page Header Editorial -->
    <div class="mb-12">
        <h2 class="text-5xl md:text-6xl font-serif font-light text-stone-900 tracking-tight mb-4">
            Hành trình <span class="italic text-stone-400">của bạn.</span>
        </h2>
        <p class="text-lg text-stone-500 font-medium max-w-2xl">
            Quản lý, theo dõi và chuẩn bị cho những trải nghiệm lưu trú độc bản sắp tới.
        </p>
    </div>

    <!-- Tab Navigation (High-Fashion Style) -->
    <div class="flex gap-8 mb-12 border-b border-stone-200 overflow-x-auto no-scrollbar">
        <button (click)="changeTab('PENDING')"
            class="text-[13px] font-bold pb-4 -mb-[1px] whitespace-nowrap uppercase tracking-[0.15em] transition-colors"
            [class]="activeTab === 'PENDING' ? 'text-[#173124] border-b-2 border-[#173124]' : 'text-stone-400 hover:text-stone-800'">
            Đang chờ thanh toán
            <span *ngIf="activeTab === 'AWAITING_PAYMENT'"
                class="bg-[#173124] text-white px-2 py-0.5 rounded-full ml-1 text-[10px]">1</span>
        </button>

        <button (click)="changeTab('UPCOMING')"
            class="text-[13px] font-bold pb-4 -mb-[1px] whitespace-nowrap uppercase tracking-[0.15em] transition-colors"
            [class]="activeTab === 'UPCOMING' ? 'text-[#173124] border-b-2 border-[#173124]' : 'text-stone-400 hover:text-stone-800'">
            Sắp khởi hành
            <span *ngIf="activeTab === 'UPCOMING'"
                class="bg-[#173124] text-white px-2 py-0.5 rounded-full ml-1 text-[10px]">2</span>
        </button>

        <button (click)="changeTab('COMPLETED')"
            class="text-[13px] font-bold pb-4 -mb-[1px] whitespace-nowrap uppercase tracking-[0.15em] transition-colors"
            [class]="activeTab === 'COMPLETED' ? 'text-[#173124] border-b-2 border-[#173124]' : 'text-stone-400 hover:text-stone-800'">
            Đã hoàn thành
        </button>

        <button (click)="changeTab('CANCELLED')"
            class="text-[13px] font-bold pb-4 -mb-[1px] whitespace-nowrap uppercase tracking-[0.15em] transition-colors"
            [class]="activeTab === 'CANCELLED' ? 'text-[#173124] border-b-2 border-[#173124]' : 'text-stone-400 hover:text-stone-800'">
            Đã hủy
        </button>
    </div>

    <!-- Trip List -->
    <div class="flex flex-col gap-10">

        <app-trip-list [status]="activeTab"></app-trip-list>

    </div>
</div>
