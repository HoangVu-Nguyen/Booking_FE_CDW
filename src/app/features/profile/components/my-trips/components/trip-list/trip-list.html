<div class="space-y-6">
    
    @for (trip of displayTrips(); track trip.bookingCode) {
        <app-trip-card [data]="trip"></app-trip-card>
    } @empty {
        <div class="flex flex-col items-center justify-center py-20 text-center border border-dashed border-stone-200 rounded-3xl bg-stone-50/30">
            <span class="material-symbols-outlined text-stone-300 text-4xl mb-3">luggage</span>
            <p class="text-[13px] font-bold text-stone-400 tracking-widest uppercase">Trống trải</p>
            <p class="text-xs text-stone-400 mt-1 max-w-xs leading-relaxed">Bạn không có hành trình nào thuộc danh mục này.</p>
        </div>
    }

</div>
