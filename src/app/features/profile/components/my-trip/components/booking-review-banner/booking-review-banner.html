<!-- 4. RATING & REVIEW (MỚI BỔ SUNG) -->
<!-- ========================================== -->
<!-- Đặt ngay dưới lịch trình để mời khách hàng đánh giá sau chuyến đi -->
<section class="max-w-[1000px] mx-auto px-6 mb-32">
    <div
        class="bg-[#173124] rounded-[2rem] p-8 md:p-10 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-8 relative overflow-hidden group">
        <!-- Background Graphic -->
        <span
            class="material-symbols-outlined absolute -right-10 -bottom-10 text-[150px] text-white/5 font-light transform -rotate-12 pointer-events-none">reviews</span>

        <div class="relative z-10 w-full md:w-auto">
            <p class="text-[#e8c39e] text-[10px] font-bold uppercase tracking-[0.2em] mb-2">Chuyến đi đã kết thúc</p>
            <h3 class="text-2xl md:text-3xl font-serif text-white mb-4">Trải nghiệm của bạn thế nào?</h3>

            <!-- Interactive Star Rating -->
            <div class="flex items-center gap-1 cursor-pointer">
                <span class="material-symbols-outlined text-[32px] text-[#e8c39e] hover:scale-110 transition-transform"
                    style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-[32px] text-[#e8c39e] hover:scale-110 transition-transform"
                    style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-[32px] text-[#e8c39e] hover:scale-110 transition-transform"
                    style="font-variation-settings: 'FILL' 1;">star</span>
                <span class="material-symbols-outlined text-[32px] text-[#e8c39e] hover:scale-110 transition-transform"
                    style="font-variation-settings: 'FILL' 1;">star</span>
                <span
                    class="material-symbols-outlined text-[32px] text-white/30 hover:scale-110 hover:text-[#e8c39e] transition-all">star</span>
            </div>
        </div>

        <div class="relative z-10 w-full md:w-auto shrink-0">
            <button
                class="w-full md:w-auto bg-white text-[#173124] px-8 py-4 rounded-full text-[12px] font-bold uppercase tracking-widest shadow-lg hover:bg-[#e8c39e] transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">edit</span> Viết đánh giá
            </button>
        </div>
    </div>
</section>
