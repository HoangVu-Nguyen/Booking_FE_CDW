@if (tripService.currentTripDetail(); as detail) {
<!-- ========================================== -->
<!-- 2. COMPREHENSIVE BOOKING BENTO GRID -->
<!-- ========================================== -->
<section class="max-w-[1400px] mx-auto px-6 md:px-10 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- CỘT CHÍNH (Chi tiết đặt phòng & Thanh toán - Chiếm 2 phần) -->
    <div class="lg:col-span-2 flex flex-col gap-6">

        <!-- Khối Thông tin chính -->
        <app-booking-main-info [data]="detail" (openRules)="setRulesModalState(true)"></app-booking-main-info>

        <!-- BỘ SƯU TẬP HÌNH ẢNH (MỚI BỔ SUNG) -->
        <app-booking-gallery [images]="detail.property.images"></app-booking-gallery>
    </div>

    <!-- CỘT PHỤ (Quản gia & Bản đồ) -->
    <div class="flex flex-col gap-6">

        <app-booking-concierge [host]="detail.host"></app-booking-concierge>
        <app-booking-map [name]="detail.property.name" [address]="detail.property.address"
            [lat]="detail.property.latitude" [lng]="detail.property.longitude"
            [image]="detail.property.images && detail.property.images.length > 0 ? detail.property.images[0] : ''">
        </app-booking-map>
    </div>
</section>

<!-- ========================================== -->
<!-- 3. FUNCTIONAL TIMELINE (Lịch trình & Dịch vụ) -->
<!-- ========================================== -->
<app-booking-timeline [tours]="detail.tours" [checkIn]="detail.checkIn" [checkOut]="detail.checkOut"
    [propertyName]="detail.property.name">
</app-booking-timeline>

<!-- ========================================== -->
<!-- 4. RATING & REVIEW (MỚI BỔ SUNG) -->
<!-- ========================================== -->
<!-- Đặt ngay dưới lịch trình để mời khách hàng đánh giá sau chuyến đi -->
<app-booking-review-banner></app-booking-review-banner>

<!-- Floating Action Bar -->
<div
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[90%] md:w-auto bg-white/90 backdrop-blur-xl border border-stone-200 p-2 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.1)] flex items-center gap-2">
    <button
        class="flex items-center gap-2 px-6 py-3 rounded-full hover:bg-stone-100 transition-colors text-stone-900 font-bold text-[11px] uppercase tracking-widest">
        <span class="material-symbols-outlined text-[18px]">receipt_long</span> Hóa đơn
    </button>
    <div class="w-[1px] h-6 bg-stone-200"></div>
    <button
        class="flex items-center gap-2 px-6 py-3 rounded-full hover:bg-stone-100 transition-colors text-stone-900 font-bold text-[11px] uppercase tracking-widest">
        <span class="material-symbols-outlined text-[18px]">share</span> Chia sẻ
    </button>
    <button
        class="flex items-center gap-2 px-8 py-3 rounded-full bg-[#173124] text-white hover:bg-[#0f2118] transition-colors font-bold text-[11px] uppercase tracking-widest ml-2 shadow-md">
        <span class="material-symbols-outlined text-[18px]">edit_calendar</span> Sửa đổi
    </button>
</div>
<app-booking-rules-modal [isOpen]="isRulesModalOpen()" [policyData]="detail" (close)="setRulesModalState(false)">
</app-booking-rules-modal>
} @else {
<div class="flex items-center justify-center h-64">
    <span class="material-symbols-outlined text-[48px] text-stone-400 animate-pulse">hourglass_empty</span>
    <p class="text-stone-400 text-sm font-medium ml-4">Đ
        ang tải chi tiết chuyến đi...</p>


</div>
}
