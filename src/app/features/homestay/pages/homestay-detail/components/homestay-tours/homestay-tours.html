@if (homestay()?.tours?.length) {
      <section class="space-y-8 py-16 border-t">
        <h3 class="text-2xl font-semibold text-primary">Trải nghiệm đi kèm</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
          @for (tourItem of homestay()!.tours; track tourItem.id) {
            
            <app-homestay-tour [tour]="tourItem"></app-homestay-tour>
            
          }
        </div>
      </section>
    }
