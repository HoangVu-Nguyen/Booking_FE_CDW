<div [routerLink]="['/homestay', homestay.id]"
    class="relative w-full h-[400px] md:h-[450px] lg:h-[500px] rounded-[2rem] overflow-hidden cursor-pointer group shadow-sm hover:shadow-2xl hover:shadow-[#173124]/10 transition-all duration-[1s] ease-[cubic-bezier(0.25,1,0.1,1)] bg-stone-100 border border-stone-200/50">

    <!-- 1A. Ảnh Nguyên Bản (Ảnh 1): Mặc định hiển thị, sáng dần và thu nhỏ khi hover -->
    <img [src]="getImageUrl(0) || coverImage" (error)="onImageError($event)" [alt]="homestay.name"
        class="absolute inset-0 w-full h-full object-cover transition-transform duration-[1.5s] ease-[cubic-bezier(0.25,1,0.1,1)] group-hover:scale-105" />

    @if (getImageUrl(1)) {
    <img [src]="getImageUrl(1)" (error)="onImageError($event)" [alt]="homestay.name + ' - View 2'"
        class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1.5s] ease-[cubic-bezier(0.25,1,0.1,1)] opacity-0 group-hover:opacity-100" />
    }

    <!-- 2. Gradient chân không: Đậm ở đáy để tôn chữ -->
    <div
        class="absolute inset-0 bg-gradient-to-t from-stone-900/80 via-stone-900/10 to-transparent opacity-80 group-hover:opacity-100 transition-opacity duration-1000 z-10 pointer-events-none">
    </div>

    <!-- 3. Badges: Trạng thái & Đánh giá -->
    <div class="absolute top-6 left-6 right-6 flex justify-between items-start z-20 pointer-events-none">
        <span
            class="bg-white/95 backdrop-blur-md text-[#173124] px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm transition-transform duration-700 group-hover:-translate-y-1">
            {{ homestay.status }}
        </span>
        <div
            class="flex items-center gap-1 bg-white/95 backdrop-blur-md text-stone-900 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm transition-transform duration-700 group-hover:-translate-y-1">
            <span class="material-symbols-outlined text-[16px] text-amber-500"
                style="font-variation-settings: 'FILL' 1;">star</span>
            {{ homestay.averageRating | number:'1.1-1' }}
        </div>
    </div>

    <!-- 5. Nội dung tương tác chính -->
    <div class="absolute inset-x-8 bottom-8 z-20 flex flex-col justify-end pointer-events-none">

        <!-- Nhịp 1: Đường kẻ line và Tên thành phố -->
        <div
            class="flex items-center gap-3 translate-y-4 group-hover:translate-y-0 transition-transform duration-700 delay-100 mb-3 opacity-90 group-hover:opacity-100">
            <span class="text-white/80 text-[10px] font-bold uppercase tracking-[0.2em] bg-white/20 backdrop-blur-sm px-3 py-1 rounded-lg">{{ homestay.cityName }}</span>
        </div>

        <!-- Nhịp 2: Tên Homestay -->
        <h2
            class="text-white text-3xl font-black tracking-tight translate-y-6 group-hover:translate-y-0 transition-transform duration-700 delay-200 mb-4 leading-snug line-clamp-2">
            {{ homestay.name }}
        </h2>

        <!-- Nhịp 3: Giá tiền và Nút bấm -->
        <div
            class="flex items-end justify-between translate-y-8 group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all duration-700 delay-300 pt-4 border-t border-white/20 mt-2">
            <div>
                <p class="text-white/70 text-[9px] uppercase font-bold tracking-[0.2em] mb-1">Giá mỗi đêm</p>
                <div class="flex items-baseline gap-1">
                    <p class="text-2xl font-black text-white leading-none">${{ homestay.basePrice | number:'1.0-0' }}</p>
                </div>
            </div>

            <button
                class="pointer-events-auto inline-flex items-center justify-center w-10 h-10 bg-white hover:bg-[#173124] text-[#173124] hover:text-white rounded-full transition-colors duration-500 shadow-lg">
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </div>
    </div>
</div>
