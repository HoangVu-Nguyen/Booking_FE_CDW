<main class="min-h-screen bg-[#f8f9fa] pt-32 pb-24">
  <div class="max-w-[1440px] mx-auto px-6 md:px-12">
    <!-- Header Section -->
    <header class="mb-16 flex flex-col md:flex-row md:items-end justify-between border-b border-stone-200 pb-10">
      <div class="max-w-2xl">
        <h1 class="text-4xl md:text-5xl lg:text-[3.5rem] font-black tracking-tight text-stone-900 leading-[1.1] mb-6">
          Nơi lưu trú <span class="text-[#173124] italic font-serif">Độc bản</span>
        </h1>
        <p class="text-lg text-stone-500 leading-relaxed font-medium">
          Khám phá những không gian sống được tuyển chọn kỹ lưỡng, mang đến trải nghiệm nghỉ dưỡng hoàn hảo và khác biệt.
        </p>
      </div>

      <!-- Stats -->
      <div class="mt-10 md:mt-0 flex items-center gap-8 md:gap-12">
        <div class="text-center">
          <span class="block text-4xl md:text-5xl font-black text-[#173124] tracking-tighter">{{homestaysRespone.length}}</span>
          <span class="block text-[10px] uppercase font-extrabold text-stone-400 tracking-[0.2em] mt-2">Homestay</span>
        </div>
        <div class="w-[1px] h-12 bg-stone-200"></div>
        <div class="text-center">
          <span class="block text-4xl md:text-5xl font-black text-[#173124] tracking-tighter">08</span>
          <span class="block text-[10px] uppercase font-extrabold text-stone-400 tracking-[0.2em] mt-2">Thành phố</span>
        </div>
      </div>
    </header>

    <!-- Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
      <app-homestay-item *ngFor="let item of homestaysRespone; let i = index" 
        [homestay]="item" 
        [layoutType]="i % 4"
        class="block group cursor-pointer"
        [ngClass]="{
          'lg:col-span-2': i % 5 === 0
        }">
      </app-homestay-item>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex flex-col items-center justify-center mt-24 mb-10 min-h-[100px]">
      <div class="animate-spin rounded-full h-12 w-12 border-[4px] border-stone-200 border-t-[#173124]"></div>
      <p class="text-sm text-stone-500 mt-5 font-bold uppercase tracking-widest">Đang tải thêm danh sách...</p>
    </div>
  </div>
</main>
