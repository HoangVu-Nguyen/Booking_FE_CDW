<div
    class="group/card flex flex-col xl:flex-row bg-white rounded-[24px] shadow-sm hover:shadow-xl border border-neutral-200/60 transition-all duration-500 overflow-hidden relative">

    <div class="relative h-[300px] xl:h-auto xl:w-[400px] shrink-0 overflow-hidden bg-neutral-900">
        <div
            class="absolute inset-0 bg-neutral-900/40 z-20 flex flex-col items-center justify-center gap-3 opacity-0 group-hover/card:opacity-100 transition duration-300 backdrop-blur-[2px]">
            <button
                class="w-40 py-2.5 bg-white rounded-full text-neutral-900 text-xs font-bold shadow-xl hover:scale-105 active:scale-95 transition flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[16px]">edit</span> Edit Property
            </button>
        </div>
        <img [src]="home.primaryImageUrl" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent pointer-events-none">
        </div>
        <div class="absolute bottom-6 left-6 right-6 z-10">
            <p class="text-white/80 text-[10px] font-bold uppercase tracking-[0.2em] mb-1">{{home.address}}</p>
            <h2 class="text-white text-3xl font-extrabold tracking-tighter leading-none mb-4 font-headline">
                {{home.homeName}}</h2>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-w-0 bg-white max-h-[450px]">

        <div class="grid grid-cols-12 bg-neutral-50/95 border-b border-neutral-200/80 sticky top-0 z-20">
            <div class="col-span-3 p-4 border-r border-neutral-200/50 flex items-center">
                <span class="text-[10px] font-extrabold text-neutral-400 uppercase tracking-widest">Rooms
                    Inventory</span>
                <div class="flex gap-1">
                    <button (click)="weekChanged.emit(-1)"
                        class="w-6 h-6 rounded bg-white border border-neutral-200 flex items-center justify-center hover:bg-neutral-100 transition">
                        <span class="material-symbols-outlined text-[14px]">chevron_left</span>
                    </button>
                    <button (click)="weekChanged.emit(1)"
                        class="w-6 h-6 rounded bg-white border border-neutral-200 flex items-center justify-center hover:bg-neutral-100 transition">
                        <span class="material-symbols-outlined text-[14px]">chevron_right</span>
                    </button>
                </div>
            </div>

            <div class="col-span-9 grid grid-cols-7 border-l border-neutral-200">
                <div *ngFor="let day of weekDays"
                    class="py-2.5 text-center border-r border-neutral-200/50 text-[9px] font-bold text-neutral-400 uppercase">
                    {{day}}
                </div>
            </div>

        </div>

        <div class="flex-1 flex flex-col divide-y divide-neutral-100 overflow-y-auto custom-scrollbar bg-neutral-50/20">

            <div *ngFor="let room of timeline"
                class="grid grid-cols-12 hover:bg-neutral-50/50 transition-colors h-[72px] shrink-0">
                <div
                    class="col-span-3 px-4 py-2 flex items-center gap-3 border-r border-neutral-200/50 bg-white group/room">

                    <div
                        class="w-10 h-10 shrink-0 rounded-lg overflow-hidden bg-neutral-50 border border-neutral-100 shadow-sm transition-transform group-hover/room:scale-105">
                        <img *ngIf="room.imageUrl" [src]="room.imageUrl" [alt]="room.roomName"
                            class="w-full h-full object-cover" />

                        <div *ngIf="!room.imageUrl"
                            class="w-full h-full flex items-center justify-center text-neutral-300 bg-neutral-100">
                            <span class="material-symbols-outlined text-[20px]">bed</span>
                        </div>
                    </div>

                    <div class="min-w-0 flex-1">
                        <h5
                            class="text-xs font-bold text-neutral-900 truncate transition-colors group-hover/room:text-primary">
                            {{room.roomName}}
                        </h5>
                        <p class="text-[9px] font-medium text-neutral-400 mt-0.5 truncate">
                            Phòng ID: {{room.roomId}}
                        </p>
                    </div>
                </div>

                <div class="col-span-9 grid grid-cols-7 relative h-full border-l border-neutral-100">
                    <div *ngFor="let i of [0,1,2,3,4,5,6]" class="border-r border-neutral-100"></div>

                    <div *ngFor="let booking of room.bookings" class="absolute top-2.5 bottom-2.5 z-10 px-1.5"
                        [ngStyle]="{'left.%': calculateBookingPosition(booking)['left.%'], 'width.%': calculateBookingPosition(booking)['width.%'], 'display': calculateBookingPosition(booking)['display']}">

                        <div [class]="getBookingColor(booking.status, room.roomId)"
                            class="w-full h-full rounded-lg shadow-sm flex items-center px-2 py-1.5 transition-all duration-300 hover:shadow-lg hover:-translate-y-[2px] hover:scale-[1.01] cursor-pointer group/booking overflow-hidden">

                            <div class="relative shrink-0 mr-2.5">
                                <img *ngIf="booking.avatar" [src]="booking.avatar"
                                    class="w-7 h-7 rounded-full object-cover border-[1.5px] border-white/40 shadow-sm" />

                                <div *ngIf="!booking.avatar"
                                    class="w-7 h-7 rounded-full bg-white/20 border-[1.5px] border-white/40 shadow-sm flex items-center justify-center backdrop-blur-sm">
                                    <span class="material-symbols-outlined text-[14px] text-white">person</span>
                                </div>

                                <span *ngIf="booking.status === 'CONFIRMED'"
                                    class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-white bg-emerald-400 shadow-sm"></span>
                            </div>

                            <div class="flex flex-col min-w-0 justify-center">
                                <span class="truncate text-[11px] font-extrabold text-white leading-none mb-1">
                                    {{booking.guestName || 'Guest User'}}
                                </span>
                                <span
                                    class="truncate text-[8px] font-black uppercase tracking-widest text-white/70 leading-none">
                                    {{booking.status}}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="bg-white border-t border-neutral-200/80 p-2.5 text-center shrink-0">
            <span class="text-[10px] font-bold text-neutral-400 uppercase">Total Rooms: {{timeline.length}}</span>
        </div>
    </div>
</div>
