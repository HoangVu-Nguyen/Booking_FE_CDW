<div class="bg-white rounded-[2rem] p-8 shadow-[0_10px_40px_-15px_rgba(0,0,0,0.05)] border border-stone-200/60 h-full flex flex-col relative overflow-hidden">
  
  <!-- Faint decorative gradient background behind the header -->
  <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-emerald-50 to-transparent opacity-50 rounded-bl-[100px] pointer-events-none"></div>

  <div class="flex flex-col xl:flex-row xl:items-start justify-between gap-6 mb-8 relative z-10">
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-2">
        <h3 class="text-xl font-black text-stone-900 tracking-tight">Doanh thu năm nay</h3>
        <span [ngClass]="growthPercentage >= 0 ? 'bg-emerald-100/80 text-emerald-700' : 'bg-red-100/80 text-red-700'" 
              class="px-2.5 py-1 text-[10px] font-black uppercase tracking-wider rounded-md">
          {{ growthPercentage >= 0 ? '+' : '' }}{{ growthPercentage | number:'1.0-1' }}%
        </span>
      </div>
      
      <div class="flex items-end gap-2 mt-1">
        <h2 class="text-4xl md:text-5xl font-black text-[#173124] tracking-tight tabular-nums">
          {{ totalThisYear | number:'1.0-0' }} <span class="text-2xl font-bold text-stone-400">₫</span>
        </h2>
      </div>
      <p class="text-sm font-medium text-stone-500 mt-1">Trung bình <span class="font-bold text-stone-700">{{ averageMonthly | number:'1.0-0' }} ₫</span> mỗi tháng</p>
    </div>
    
    <!-- Custom Legend -->
    <div class="flex flex-col items-start xl:items-end gap-4">
      <div class="flex bg-stone-100 p-1 rounded-xl">
        <button class="px-4 py-1.5 bg-white shadow-sm text-stone-900 text-xs font-bold rounded-lg transition-all">Năm nay</button>
        <button class="px-4 py-1.5 text-stone-500 hover:text-stone-900 text-xs font-bold rounded-lg transition-all">Năm ngoái</button>
      </div>
      
      <div class="flex items-center gap-6 px-2">
        <div class="flex items-center gap-2 group cursor-pointer">
          <span class="w-3 h-3 rounded-full bg-[#173124] shadow-[0_0_10px_rgba(23,49,36,0.4)] group-hover:scale-110 transition-transform"></span>
          <span class="text-xs font-bold text-stone-700">Thực tế</span>
        </div>
        <div class="flex items-center gap-2 group cursor-pointer">
          <span class="w-3 h-3 rounded-full border-2 border-stone-300 group-hover:scale-110 transition-transform"></span>
          <span class="text-xs font-bold text-stone-400">Kỳ vọng</span>
        </div>
      </div>
    </div>
  </div>

  <div class="flex-1 w-full relative min-h-[350px] mt-4 z-10">
    <canvas baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      [type]="lineChartType">
    </canvas>
  </div>

</div>
