<div class="relative group">
  <button
    class="relative w-12 h-12 rounded-2xl flex items-center justify-center
           text-[#173124] bg-white border border-stone-200
           shadow-sm hover:bg-stone-50 hover:border-stone-300
           active:scale-95 transition-all duration-200">

    <span class="material-symbols-outlined text-[27px]">
      forum
    </span>

    @if (chatService.totalUnreadCount() > 0) {
      <span
        class="absolute top-2 right-2 w-3.5 h-3.5 rounded-full
               bg-rose-500 border-2 border-white animate-pulse">
      </span>
    }
  </button>

  <div
    class="absolute right-0 mt-3 w-[420px]
           bg-white rounded-[28px]
           border border-stone-200
           shadow-[0_18px_45px_rgba(15,23,42,0.12)]
           opacity-0 invisible translate-y-2 scale-[0.98]
           group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 group-hover:scale-100
           transition-all duration-200 origin-top-right z-50 overflow-hidden">

    <div class="px-5 py-4 border-b border-stone-100 bg-white">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h4 class="text-[17px] font-bold text-stone-950 tracking-tight">
            Hộp thư gần đây
          </h4>
          <p class="text-[13px] text-stone-500 mt-1">
            Theo dõi nhanh các tin nhắn mới nhất của bạn
          </p>
        </div>

        @if (unreadInMenuCount() > 0) {
          <div
            class="shrink-0 px-2.5 py-1 rounded-full
                   bg-emerald-50 text-emerald-700
                   border border-emerald-100
                   text-[12px] font-semibold">
            {{ unreadInMenuCount() }} mới
          </div>
        }
      </div>
    </div>

    <div class="max-h-[430px] overflow-y-auto no-scrollbar bg-white">

      @for (conv of quickConversations(); track conv.id) {
        <button (click)="openChatRoom(conv.id, conv.targetUserId)"
          class="relative w-full p-5 flex items-start gap-4 transition-colors text-left border-b border-stone-50"
          [ngClass]="conv.unreadCount > 0 ? 'bg-[#f3faf6] hover:bg-[#eef8f2]' : 'bg-white hover:bg-stone-50'">

          <div class="relative shrink-0">
            @if (conv.targetAvatar) {
              <img [src]="conv.targetAvatar" 
                   class="w-12 h-12 rounded-[18px] object-cover border border-stone-100">
            } @else {
              <div class="w-12 h-12 rounded-[18px] bg-emerald-800 text-white flex items-center justify-center font-bold text-[15px]">
                {{ getInitials(conv.targetName) }}
              </div>
            }

            @if (conv.unreadCount > 0) {
              <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white"></span>
            }
          </div>

          <div class="flex-1 min-w-0" [class.pr-5]="conv.unreadCount > 0">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h5 class="text-[14.5px] truncate leading-tight" 
                    [ngClass]="conv.unreadCount > 0 ? 'font-bold text-stone-950' : 'font-semibold text-stone-800'">
                  {{ conv.targetName }}
                </h5>

                <p class="text-[12px] text-stone-400 mt-1 truncate font-medium">
                  {{ conv.propertyName || 'Khách vãng lai' }}
                </p>
              </div>

              <span class="text-[11px] shrink-0 pt-0.5 font-medium" 
                    [ngClass]="conv.unreadCount > 0 ? 'text-emerald-700 font-bold' : 'text-stone-400'">
                {{ conv.lastMessageTime || 'Vừa xong' }}
              </span>
            </div>

            <p class="text-[13px] truncate mt-2 leading-relaxed"
               [ngClass]="conv.unreadCount > 0 ? 'text-stone-800 font-medium' : 'text-stone-500'">
              {{ conv.lastMessage || 'Bắt đầu cuộc trò chuyện...' }}
            </p>
          </div>

          @if (conv.unreadCount > 0) {
            <div class="absolute right-5 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
          }
        </button>
      }

      @if (quickConversations().length === 0) {
        <div class="p-8 text-center text-stone-400 text-[13.5px]">Hộp thư của bạn đang trống.</div>
      }
    </div>

    <div class="px-5 py-4 border-t border-stone-100 bg-stone-50">
      <a routerLink="/inbox"
        class="w-full h-10 rounded-full bg-white border border-stone-200
               flex items-center justify-center gap-2
               text-[13px] font-semibold text-[#173124]
               hover:bg-stone-100 transition-colors no-underline">
        <span>Xem tất cả hộp thư</span>
        <span class="material-symbols-outlined text-[17px]">arrow_forward</span>
      </a>
    </div>
  </div>
</div>
