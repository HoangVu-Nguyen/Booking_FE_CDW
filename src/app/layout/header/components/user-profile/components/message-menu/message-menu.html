<div class="relative group">
  <!-- Trigger Button -->
  <button
    class="relative w-12 h-12 rounded-2xl flex items-center justify-center
           text-[#173124] bg-white border border-stone-200
           shadow-sm hover:bg-stone-50 hover:border-stone-300
           active:scale-95 transition-all duration-200">

    <span class="material-symbols-outlined text-[27px]">
      forum
    </span>

    <!-- unread dot -->
    <span
      class="absolute top-2 right-2 w-3.5 h-3.5 rounded-full
             bg-rose-500 border-2 border-white">
    </span>
  </button>

  <!-- Dropdown -->
  <div
    class="absolute right-0 mt-3 w-[420px]
           bg-white rounded-[28px]
           border border-stone-200
           shadow-[0_18px_45px_rgba(15,23,42,0.12)]
           opacity-0 invisible translate-y-2 scale-[0.98]
           group-hover:opacity-100 group-hover:visible group-hover:translate-y-0 group-hover:scale-100
           transition-all duration-200 origin-top-right z-50 overflow-hidden">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-stone-100 bg-white">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h4 class="text-[17px] font-bold text-stone-950 tracking-tight">
            Hội thoại nhóm
          </h4>
          <p class="text-[13px] text-stone-500 mt-1">
            Theo dõi tin nhắn từ các chuyến đi của bạn
          </p>
        </div>

        <div
          class="shrink-0 px-2.5 py-1 rounded-full
                 bg-emerald-50 text-emerald-700
                 border border-emerald-100
                 text-[12px] font-semibold">
          1 mới
        </div>
      </div>
    </div>

    <!-- Conversation List -->
    <div class="max-h-[430px] overflow-y-auto no-scrollbar bg-white">

      <!-- Active unread item -->
      <button
        class="relative w-full p-5 flex items-start gap-4
               bg-[#f3faf6] hover:bg-[#eef8f2]
               transition-colors text-left">

        <div
          class="relative w-13 h-13 min-w-13 rounded-[20px]
                 bg-[#173124] text-white
                 flex items-center justify-center
                 font-bold text-[16px]
                 border border-[#173124]/10">
          DL

          <span
            class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5
                   rounded-full bg-emerald-500 border-2 border-white">
          </span>
        </div>

        <div class="flex-1 min-w-0 pr-7">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h5 class="text-[15px] font-bold text-stone-950 truncate">
                Tour Đà Lạt 3N2Đ
              </h5>

              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[12px] text-emerald-700 font-medium">
                  Đang hoạt động
                </span>
                <span class="w-1 h-1 rounded-full bg-stone-300"></span>
                <span class="text-[12px] text-stone-500">
                  6 thành viên
                </span>
              </div>
            </div>

            <span class="text-[11px] text-emerald-700 font-semibold shrink-0">
              10:30
            </span>
          </div>

          <p class="text-[13.5px] text-stone-700 truncate mt-2 leading-relaxed">
            <strong class="font-semibold text-stone-900">Hải Đăng:</strong>
            Mai mấy giờ đi mọi người?
          </p>
        </div>

        <div
          class="absolute right-5 top-1/2 -translate-y-1/2
                 w-2.5 h-2.5 rounded-full bg-emerald-500">
        </div>
      </button>

      <!-- Normal item -->
      <button
        class="w-full p-5 flex items-start gap-4
               bg-white hover:bg-stone-50
               transition-colors text-left border-t border-stone-100">

        <div
          class="relative w-13 h-13 min-w-13 rounded-[20px]
                 bg-amber-50 text-amber-700
                 flex items-center justify-center
                 font-bold text-[16px]
                 border border-amber-100">
          PQ
        </div>

        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h5 class="text-[15px] font-semibold text-stone-900 truncate">
                Khám phá Phú Quốc
              </h5>

              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[12px] text-stone-500">
                  Đã kết thúc
                </span>
                <span class="w-1 h-1 rounded-full bg-stone-300"></span>
                <span class="text-[12px] text-stone-500">
                  4 thành viên
                </span>
              </div>
            </div>

            <span class="text-[11px] text-stone-400 shrink-0">
              Hôm qua
            </span>
          </div>

          <p class="text-[13.5px] text-stone-500 truncate mt-2 leading-relaxed">
            <strong class="font-medium text-stone-700">Bạn:</strong>
            Cảm ơn HDV nhé!
          </p>
        </div>
      </button>

      <!-- Normal item -->
      <button
        class="w-full p-5 flex items-start gap-4
               bg-white hover:bg-stone-50
               transition-colors text-left border-t border-stone-100">

        <div
          class="relative w-13 h-13 min-w-13 rounded-[20px]
                 bg-sky-50 text-sky-700
                 flex items-center justify-center
                 font-bold text-[16px]
                 border border-sky-100">
          NT
        </div>

        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h5 class="text-[15px] font-semibold text-stone-900 truncate">
                Nha Trang cuối tuần
              </h5>

              <div class="flex items-center gap-1.5 mt-1">
                <span class="text-[12px] text-stone-500">
                  Sắp khởi hành
                </span>
                <span class="w-1 h-1 rounded-full bg-stone-300"></span>
                <span class="text-[12px] text-stone-500">
                  8 thành viên
                </span>
              </div>
            </div>

            <span class="text-[11px] text-stone-400 shrink-0">
              Thứ 2
            </span>
          </div>

          <p class="text-[13.5px] text-stone-500 truncate mt-2 leading-relaxed">
            <strong class="font-medium text-stone-700">Linh:</strong>
            Mình đã gửi lịch trình chi tiết rồi nha.
          </p>
        </div>
      </button>
    </div>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-stone-100 bg-stone-50">
      <a
        href="#"
        class="w-full h-10 rounded-full bg-white border border-stone-200
               flex items-center justify-center gap-2
               text-[13px] font-semibold text-[#173124]
               hover:bg-stone-100 transition-colors">

        <span>Xem tất cả nhóm</span>
        <span class="material-symbols-outlined text-[17px]">
          arrow_forward
        </span>
      </a>
    </div>
  </div>
</div>
