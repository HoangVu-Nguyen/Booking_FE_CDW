<div class="relative">
      <button (click)="toggle.emit()"
        class="relative group w-11 h-11 flex items-center justify-center rounded-2xl border transition-all duration-300"
        [ngClass]="isOpen ? 'bg-gray-100 border-gray-300 shadow-inner' : 'bg-white border-gray-200/70 text-gray-500 hover:text-black hover:border-gray-300 hover:shadow-lg hover:-translate-y-0.5'"
        title="Tin nhắn">
        <span class="material-symbols-outlined text-[22px]">mail</span>
        <span class="absolute -top-1 -right-1 min-w-[20px] h-[20px] px-1.5 rounded-full bg-blue-600 text-white text-[10px] font-bold flex items-center justify-center shadow-sm">2</span>
      </button>

      <div
        class="absolute right-0 top-[calc(100%+14px)] w-[360px] rounded-[24px] border border-gray-200/70 bg-white/95 backdrop-blur-2xl shadow-[0_20px_60px_rgba(0,0,0,0.15)] overflow-hidden z-[999] transition-all duration-300 origin-top-right"
        [class.opacity-100]="isOpen" [class.scale-100]="isOpen" [class.translate-y-0]="isOpen" [class.visible]="isOpen"
        [class.opacity-0]="!isOpen" [class.scale-95]="!isOpen" [class.-translate-y-2]="!isOpen" [class.invisible]="!isOpen">

        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-white/80">
          <h3 class="text-base font-bold text-gray-900">Tin nhắn mới</h3>
        </div>

        <div class="max-h-[360px] overflow-y-auto custom-scrollbar p-2 space-y-1">
          <p class="p-4 text-sm text-center text-gray-500">Khu vực hiển thị tin nhắn</p>
        </div>

        <div class="p-3 border-t border-gray-100 bg-gray-50/50">
          <button class="w-full py-2.5 text-sm font-semibold text-gray-600 hover:text-black hover:bg-white rounded-xl transition-colors shadow-sm border border-transparent hover:border-gray-200 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">forum</span> Mở hộp thư
          </button>
        </div>
      </div>
    </div>
