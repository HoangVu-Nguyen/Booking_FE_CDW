@if (service.state(); as s) {
<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl p-8 transform transition-all">

        <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mb-6 mx-auto">
            <span class="material-symbols-outlined text-[32px] text-red-500">warning</span>
        </div>

        <h2 class="text-xl font-extrabold text-gray-900 mb-3 text-center">{{ s.title }}</h2>

        <p class="text-base text-gray-600 mb-6 text-center leading-relaxed" [innerHTML]="s.message | safeHtml"></p>

        @if (s.showInput) {
        <textarea #reasonInput
            class="w-full mb-8 p-4 rounded-xl border border-stone-200 focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
            rows="3" placeholder="Vui lòng nhập lý do..."></textarea>
        }

        <div class="flex gap-4">
            <button (click)="service.close()"
                class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-semibold text-[15px] hover:bg-gray-200 transition-colors">
                Hủy
            </button>
            <button (click)="handleConfirm(s.onConfirm); service.close()"
                class="flex-1 py-3 rounded-xl bg-red-600 text-white font-semibold text-[15px] hover:bg-red-700 transition-colors shadow-lg shadow-red-200">
                Xác nhận
            </button>
        </div>
    </div>
</div>
}
