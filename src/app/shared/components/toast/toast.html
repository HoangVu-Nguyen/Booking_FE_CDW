<div class="fixed top-6 right-6 sm:bottom-8 sm:right-8 z-[9999] flex w-[calc(100%-2rem)] max-w-[400px] flex-col gap-4 pointer-events-none">

  @for (toast of toastService.toasts(); track toast.id; let i = $index) {

    <div
      class="toast-enter-anim pointer-events-auto group relative overflow-hidden rounded-[16px] border border-gray-200/80 bg-white p-4 sm:p-5 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.12),0_1px_3px_rgba(0,0,0,0.04)]"
      [style.animation-delay.ms]="i * 40">

      <div class="absolute top-0 left-0 w-full h-[3px] bg-gray-100">
         <div class="toast-timer-line h-full"
            [ngClass]="{
              'bg-emerald-500': toast.type === 'success',
              'bg-rose-500': toast.type === 'error',
              'bg-blue-500': toast.type === 'info',
              'bg-amber-500': toast.type === 'warning'
            }">
         </div>
      </div>

      <div class="flex items-start gap-4 mt-1">
        
        <div class="mt-0.5 shrink-0 flex h-8 w-8 items-center justify-center rounded-full ring-4"
             [ngClass]="{
               'bg-emerald-100 text-emerald-600 ring-emerald-50': toast.type === 'success',
               'bg-rose-100 text-rose-600 ring-rose-50': toast.type === 'error',
               'bg-blue-100 text-blue-600 ring-blue-50': toast.type === 'info',
               'bg-amber-100 text-amber-600 ring-amber-50': toast.type === 'warning'
             }">
             
          @if (toast.type === 'success') {
            <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1">check</span>
          } @else if (toast.type === 'error') {
            <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1">close</span>
          } @else if (toast.type === 'info') {
            <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1">info</span>
          } @else if (toast.type === 'warning') {
            <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1">priority_high</span>
          }
        </div>

        <div class="flex-1 min-w-0 pr-2">
          <h4 class="text-[14px] font-bold text-gray-900 leading-tight mb-1">
            {{ toast.title }}
          </h4>
          <p class="text-[13.5px] text-gray-600 leading-relaxed font-medium">
            {{ toast.message }}
          </p>
        </div>

        <button
          type="button"
          (click)="toastService.remove(toast.id)"
          class="shrink-0 flex h-7 w-7 items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-800 transition-colors opacity-60 group-hover:opacity-100">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
        
      </div>
    </div>
  }
</div>
