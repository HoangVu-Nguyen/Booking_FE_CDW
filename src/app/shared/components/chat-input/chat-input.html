<footer class="bg-white p-3 shrink-0 border-t border-emerald-900/5 relative">
  
  <form (ngSubmit)="onSend()"
    class="flex items-end gap-2 bg-[#f9faf9] border border-stone-200 rounded-[24px] p-1.5 focus-within:border-[#173124]/40 focus-within:bg-white focus-within:shadow-[0_2px_12px_rgba(23,49,36,0.04)] transition-all duration-200 relative">
    
    <div class="relative shrink-0 flex items-center justify-center">
      
      <button type="button" (click)="toggleMenu()"
        class="w-9 h-9 rounded-full text-stone-400 hover:text-[#173124] hover:bg-stone-200/50 flex items-center justify-center transition-all duration-200">
        <span class="material-symbols-outlined text-[22px] transition-transform duration-200"
              [class.rotate-45]="isMenuOpen()"
              [class.text-rose-500]="isMenuOpen()">
          add_circle
        </span>
      </button>

      @if (isMenuOpen()) {
        <div class="absolute bottom-12 left-0 bg-white border border-stone-200/80 rounded-[16px] p-1.5 shadow-[0_4px_20px_rgba(0,0,0,0.08)] flex flex-col gap-0.5 min-w-[170px] z-50 origin-bottom-left transition-all">
          
          <button type="button" (click)="triggerInput(imageInput)"
            class="flex items-center gap-2.5 px-3 py-2 text-[13.5px] font-semibold text-stone-700 hover:bg-stone-100/70 rounded-[10px] transition-colors text-left w-full">
            <span class="material-symbols-outlined text-emerald-600 text-[20px]">image</span>
            <span>Hình ảnh & Video</span>
          </button>
          
          <button type="button" (click)="triggerInput(fileInput)"
            class="flex items-center gap-2.5 px-3 py-2 text-[13.5px] font-semibold text-stone-700 hover:bg-stone-100/70 rounded-[10px] transition-colors text-left w-full">
            <span class="material-symbols-outlined text-blue-500 text-[20px]">description</span>
            <span>Tài liệu & Tệp tin</span>
          </button>

        </div>

        <div class="fixed inset-0 z-40 bg-transparent" (click)="isMenuOpen.set(false)"></div>
      }
    </div>
    
    <input type="file" #imageInput multiple accept="image/*,video/*" class="hidden" (change)="onFileSelected($event, 'IMAGE')">
    <input type="file" #fileInput multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" class="hidden" (change)="onFileSelected($event, 'FILE')">

    <textarea [ngModel]="newMessage()" (ngModelChange)="newMessage.set($event)" 
      name="chatInput" rows="1"
      placeholder="Nhập tin nhắn..."
      (keydown)="onKeyDown($event)"
      class="flex-1 max-h-24 resize-none bg-transparent border-none outline-none px-1 py-2.5 text-[14.5px] text-stone-800 placeholder:text-stone-400 focus:ring-0"></textarea>

    <button type="submit" [disabled]="!newMessage().trim()"
      title="Gửi tin nhắn"
      class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition-all duration-300"
      [ngClass]="newMessage().trim() ? 'bg-[#173124] text-white shadow-md hover:bg-[#10261b] scale-100' : 'bg-stone-200 text-stone-400 cursor-not-allowed scale-95'">
      <span class="material-symbols-outlined text-[18px] ml-0.5">send</span>
    </button>
  </form>
</footer>
